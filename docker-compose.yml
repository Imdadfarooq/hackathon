services:
  mongo:
    image: mongo:7
    container_name: psd-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: student_dashboard
    volumes:
      - psd_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build: ./server
    container_name: psd-server
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/student_dashboard
      JWT_SECRET: change-me-in-production-please-use-a-long-random-string
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:5173

volumes:
  psd_mongo_data:
